name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build src/UnitTestingTutorial.slnx

      - name: Test with coverage
        run: dotnet test src/UnitTestingTutorial.slnx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-cobertura-xml
          path: TestResults/**/coverage.cobertura.xml
